const TR=[['Lucky Clover','More hearts drop','#6fcf6f'],['Ghost Ring','Tears pierce enemies','#bfe6ff'],['Vampire Fang','Heal a little every 10 kills','#c0392b'],['Shield Rune','Blocks the first hit in each room','#ffd86b'],['Swift Feather','Longer safety after being hit','#f5f0e0'],['Critical Eye','20% chance of double damage','#ff9a3c'],['Echo Bell','Also fires behind you','#d9a441'],['Snowflake','Freezes enemies when you are hit','#bfe6ff',1],['Pot of Gold','+3 coins every room you clear','#ffd86b',2],['Spark Core','Slain enemies burst into damaging sparks','#ff9a3c',4]];

let S='title',P,rooms,cur,tears=[],shots=[],en=[],parts=[],floor=1,msg='',msgT=0,tk=0,shake=0,sel=-1;
const keys={},mouse={x:0,y:0,down:0};
const key=(x,y)=>x+','+y,nb=(r,dx,dy)=>rooms[key(r.x+dx,r.y+dy)];

function gen(){
  rooms={};let x=2,y=2,n=1,target=9+Math.min(floor,3);
  rooms[key(2,2)]={x:2,y:2,t:'start',clr:1,pk:[],dec:[]};
  while(n<target){
    const d=[[1,0],[-1,0],[0,1],[0,-1]][ri(0,3)],nx=x+d[0],ny=y+d[1];
    if(nx<0||ny<0||nx>4||ny>4)continue;x=nx;y=ny;
    if(!rooms[key(x,y)]){rooms[key(x,y)]={x,y,t:'n',clr:0,pk:[],dec:[]};n++}
  }
  const dist={},q=[rooms[key(2,2)]];dist[key(2,2)]=0;
  while(q.length){const r=q.shift();for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){const o=nb(r,d[0],d[1]);if(o&&dist[key(o.x,o.y)]===undefined){dist[key(o.x,o.y)]=dist[key(r.x,r.y)]+1;q.push(o)}}}
  const list=Object.values(rooms).filter(r=>r.t==='n').sort((a,b)=>dist[key(b.x,b.y)]-dist[key(a.x,a.y)]);
  list[0].t='boss';list[0].clr=0;
  const ir=list[list.length-1];ir.t='item';ir.clr=1;ir.pk.push({t:'i',x:CX,y:CY,i:ri(0,ITEMS.length-1)});
  const rem=list.slice(1,-1).sort(()=>Math.random()-.5);
  if(rem[0]){const s=rem[0];s.t='shop';s.clr=1;s.pk.push({t:'h',x:CX-130,y:CY,price:3},{t:'i',x:CX,y:CY,i:ri(0,ITEMS.length-1),price:8},{t:'t',x:CX+130,y:CY,i:randTR(),price:6})}
  if(rem[1]){const p=rem[1];p.t='puzzle';p.clr=1;p.cr=[[L+90,T+80],[R-90,T+80],[L+90,B-80],[R-90,B-80]].map(a=>({x:a[0],y:a[1],r:16,lit:0}));p.obs=PAT(1)}
  if(rem[2]&&Math.random()<.7){const h=rem[2];h.t='shrine';h.clr=1;h.sh=ri(0,1)}
  for(const r of Object.values(rooms))if(r.t==='n')r.obs=PAT(ri(0,4));
  for(const r of Object.values(rooms))for(let i=0;i<9;i++)r.dec.push([rnd(L+20,R-20),rnd(T+20,B-20),rnd(10,34)]);
}
function spawn(r){
  en=[];
  if(r.t==='boss'){const bk=bkFloor;en.push({x:CX,y:200,r:[44,44,44,38,46,44][bk],hp:(140+floor*55)*[1,.9,1.3,.85,1.1,1.2][bk],ty:3,bk,cd:0,vx:0,vy:0,sp:60,fl:0});en[0].mhp=en[0].hp;return}
  const n=ri(3,4)+Math.floor(floor/2),m=1+.25*(floor-1);
  for(let i=0;i<n;i++){
    let x,y;do{x=rnd(L+40,R-40);y=rnd(T+40,B-40)}while(Math.hypot(x-P.x,y-P.y)<170||hitO(x,y,26));
    const ty=ri(0,2),hp=[8,7,10][ty]*m;
    en.push({x,y,r:[14,14,15][ty],hp,mhp:hp,ty,cd:ri(30,90),vx:ri(0,1)?1.6:-1.6,vy:ri(0,1)?1.6:-1.6,sp:40+i*8,fl:0});
  }
}
function enter(r){cur=r;r.seen=1;tears=[];shots=[];en=[];puddles=[];if(!r.clr)withSeed('r'+floor+r.x+','+r.y,()=>spawn(r))}
function newFloor(){bkFloor=floor<=6?floor-1:(MP?hashS(MP.code+floor)%6:Math.floor(Math.random()*6));withSeed('f'+floor,gen);P.x=CX;P.y=CY;P.vx=P.vy=0;enter(rooms[key(2,2)])}
function start(i){const c=CH[i];if(!isU(c))return;if(MYID&&DBc&&!MYUN){S='friends';return}P={x:CX,y:CY,vx:0,vy:0,hp:c.hp,max:c.hp,sp:c.sp,dmg:c.dmg,rate:c.rate,range:1,triple:c.t||0,tr:-1,kc:0,coins:c.k==='hunter'?12:0,cd:0,inv:0,col:c.c,n:c.n,ch:c,ang:1.57};floor=1;msg='';if(c.k==='forge')ITEMS[ri(0,5)][2](P);newFloor();showMsg('Depth 1: '+TH[bkFloor].n);S='play'}
function go(dx,dy){
  const r=nb(cur,dx,dy);
  if(dx<0)P.x=R-24;if(dx>0)P.x=L+24;if(dy<0)P.y=B-24;if(dy>0)P.y=T+24;
  enter(r);
}
function burst(x,y,c,n,s){for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(.5,s||3);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:ri(18,34),c,s:rnd(2,5)})}}
function hurt(d){if(P.inv>0)return;if(P.tr===3&&!cur.ward){cur.ward=1;P.inv=60;burst(P.x,P.y,'#ffd86b',16,4);return}P.hp-=d;P.inv=P.tr===4?115:70;shake=9;if(P.tr===7)for(const q of en)q.slow=180;burst(P.x,P.y,'#ff4d6d',14,4);if(P.hp<=0&&P.ch.k==='skel'&&!P.re){P.re=1;P.hp=Math.min(P.max,4);P.inv=130;showMsg('Ribeye pulls himself together!')}else if(P.hp<=0){S='dead';mpPres({al:0});burst(P.x,P.y,P.col,40,6)}}
function fire(a,e2){if(P.tr===6&&!e2)fire(a+Math.PI,1);
  const n=P.triple?3:1,cr=(P.tr===5&&Math.random()<.2?2:1)*(e2?.6:1);
  for(let i=0;i<n;i++){const b=a+(i-(n-1)/2)*.22;
    mpBuf.push(tears[tears.push({h:(P.tr===1||P.ch.k==='demon')?new Set():null,k:P.ch.k,x:P.x,y:P.y-4,vx:Math.cos(b)*6+P.vx*.35,vy:Math.sin(b)*6+P.vy*.35,life:52*P.range,r:5+P.dmg*.7,d:P.dmg*(P.triple?1/3:1)*cr})-1])}
}
function eshot(x,y,a,s,d){shots.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:7,d})}
function showMsg(t){msg=t;msgT=180}

function upd(){
  const r=cur;
  // movement
  if(MP){MP.r.presence({c:CH.indexOf(P.ch),x:Math.round(P.x),y:Math.round(P.y),a:+P.ang.toFixed(2),hp:P.hp,rk:rk(),f:floor,al:1}).catch(()=>{});if(mpBuf.length)MP.r.emit('shot',{f:floor,rk:rk(),t:mpBuf.map(t=>({x:Math.round(t.x),y:Math.round(t.y),vx:+t.vx.toFixed(2),vy:+t.vy.toFixed(2),life:t.life,r:+t.r.toFixed(1),d:+t.d.toFixed(2),k:t.k}))}).catch(()=>{})}mpBuf=[];
  let ax=(keys.KeyD?1:0)-(keys.KeyA?1:0),ay=(keys.KeyS?1:0)-(keys.KeyW?1:0),m=Math.hypot(ax,ay)||1;
  P.vx+=(ax/m*P.sp-P.vx)*.25;P.vy+=(ay/m*P.sp-P.vy)*.25;
  P.x+=P.vx;P.y+=P.vy;
  const pr=14,dy=Math.abs(P.y-CY)<32,dx=Math.abs(P.x-CX)<32;
  let x0=L+pr,x1=R-pr,y0=T+pr,y1=B-pr;
  if(r.clr){if(nb(r,-1,0)&&dy)x0=L-8;if(nb(r,1,0)&&dy)x1=R+8;if(nb(r,0,-1)&&dx)y0=T-8;if(nb(r,0,1)&&dx)y1=B+8}
  P.x=cl(P.x,x0,x1);P.y=cl(P.y,y0,y1);
  for(const o of P.ch.k==='ghost'?[]:(r.obs||[])){const ox=P.x-o.x,oy=P.y-o.y,od=Math.hypot(ox,oy),om=o.r+pr;if(od<om&&od>0){P.x=o.x+ox/od*om;P.y=o.y+oy/od*om}}
  if(P.x<L-2)return go(-1,0);if(P.x>R+2)return go(1,0);if(P.y<T-2)return go(0,-1);if(P.y>B+2)return go(0,1);
  if(P.inv>0)P.inv--;
  // shooting
  let sx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),sy=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0),aim=null;
  if(sx||sy)aim=Math.atan2(sy,sx);else if(mouse.down)aim=Math.atan2(mouse.y-P.y,mouse.x-P.x);
  if(P.cd>0)P.cd--;
  if(aim!==null){P.ang=aim;if(P.cd<=0){fire(aim);P.cd=P.rate}}
  else if(Math.hypot(P.vx,P.vy)>.5)P.ang=Math.atan2(P.vy,P.vx);
  // tears
  for(const t of tears){
    if(t.k==='mage'){let b=null,bd=1e9;for(const e of en){if(e.sp>0||e.hp<=0)continue;const d=Math.hypot(e.x-t.x,e.y-t.y);if(d<bd){bd=d;b=e}}if(b&&bd<340){const sp=Math.hypot(t.vx,t.vy),a=Math.atan2(t.vy,t.vx),ta=Math.atan2(b.y-t.y,b.x-t.x);let da=ta-a;while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;const na=a+Math.max(-.14,Math.min(.14,da));t.vx=Math.cos(na)*sp;t.vy=Math.sin(na)*sp}}
    t.x+=t.vx;t.y+=t.vy;t.life--;for(const c of r.cr||[])if(!t.dead&&Math.hypot(c.x-t.x,c.y-t.y)<c.r+t.r){c.lit=480;t.dead=1;burst(c.x,c.y,'#9fe8ff',8,3)}if(t.dead)continue;
    if(t.x<L||t.x>R||t.y<T||t.y>B||t.life<=0||hitO(t.x,t.y,2)){t.dead=1;burst(t.x,t.y,'#ffe9a8',5,2);continue}
    for(const e of en){if(e.sp>0||e.hp<=0)continue;
      if(Math.hypot(e.x-t.x,e.y-t.y)<e.r+t.r){if(t.h&&t.h.has(e))continue;e.hp-=t.d;e.fl=6;if(t.k==='demon')e.burn=180;if(t.k==='frost'||(P.frost&&!t.ally))e.slow=150;if((t.k==='forge'||P.knock)&&e.ty!==3&&!t.ally){const l=Math.hypot(t.vx,t.vy)||1;e.x+=t.vx/l*14;e.y+=t.vy/l*14}if(P.ch.k==='vamp'&&(P.vh=(P.vh||0)+1)%14===0)P.hp=Math.min(P.max,P.hp+1);if(t.h)t.h.add(e);else t.dead=1;burst(t.x,t.y,'#ffe9a8',6,3);
        if(e.ty!==3){const l=Math.hypot(t.vx,t.vy)||1;e.x+=t.vx/l*3;e.y+=t.vy/l*3}break}}
  }
  for(const t of tears)if(t.dead&&t.k==='pumpkin')puddles.push({x:t.x,y:t.y,r:30,t:180,d:t.d*.012});tears=tears.filter(t=>!t.dead);for(const p of puddles){p.t--;for(const e of en)if(e.sp<=0&&Math.hypot(e.x-p.x,e.y-p.y)<p.r+e.r*.6){e.hp-=p.d;e.burn=Math.max(e.burn||0,60)}}puddles=puddles.filter(p=>p.t>0);
  // enemies
  for(const e of en){
    if(e.fl>0)e.fl--;if(e.burn>0){e.burn--;e.hp-=.025;if(tk%6===0)burst(e.x+rnd(-e.r,e.r)*.6,e.y-e.r*.4,'#ff9a3c',1,1.2)}if(e.slow>0){e.slow--;if(tk%2)continue}
    if(e.sp>0){e.sp--;continue}
    const d=Math.hypot(P.x-e.x,P.y-e.y)||1,ux=(P.x-e.x)/d,uy=(P.y-e.y)/d;
    if(e.ty===0){const s=.9+floor*.06;e.x+=ux*s;e.y+=uy*s}
    else if(e.ty===1){const s=d>230?.8:-.6;e.x+=ux*s;e.y+=uy*s;if(--e.cd<=0){e.cd=105;eshot(e.x,e.y,Math.atan2(uy,ux),3,1)}}
    else if(e.ty===2){e.x+=e.vx;e.y+=e.vy;if(e.x<L+e.r||e.x>R-e.r)e.vx*=-1;if(e.y<T+e.r||e.y>B-e.r)e.vy*=-1}
    else if(e.bk>0){bossAI(e,ux,uy,d)}else{e.x+=ux*.55;e.y+=uy*.55;e.cd++;
